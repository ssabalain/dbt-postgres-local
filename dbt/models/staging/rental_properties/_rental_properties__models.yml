version: 2

models:

  - name: stg_rental_properties__amenities_changes
    columns:
      - name: amenities_change_id
        data_tests:
          - unique

  - name: stg_rental_properties__listing_bookings
    columns:
      - name: listing_booking_id
        data_tests:
          - unique
      - name: price_per_night
        data_tests:
          - not_null
      - name: booking_date
        data_tests:
          - dbt_utils.sequential_values:
              interval: 1
              group_by_columns: [listing_id]
              datepart: 'day'

  - name: stg_rental_properties__listings
    columns:
      - name: listing_id
        data_tests:
          - unique

  - name: stg_rental_properties__reviews
    columns:
      - name: review_id
        data_tests:
          - unique

  - name: stg_rental_properties__hosts
    columns:
      - name: host_id
        data_tests:
          - unique